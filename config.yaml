TRAIN:
  BATCH_SIZE: 128
  EPOCHS: 400
  ACCUM_ITER: 2
  SAVE_FREQ: 50
  SEED: 0
  START_EPOCH: 0
  NUM_WORKERS: 8
  PIN_MEM: true
  DEVICE: cuda

DATA:
  DATA_PATH: .datasets/intraoral
  VAL_DATA_PATH: ""
  VAL_RATIO: 0.1
  # 病例级 train/test 划分（datasets/split.py::create_or_load_split）。
  # 设置 SPLIT_JSON 后，--val_data_path / --val_ratio 的路径序划分不再生效。
  SPLIT_JSON: ".datasets/intraoral/train_test_seed0_test0p2.json"
  SPLIT: train
  CATEGORIES: "full,tooth,sextant,group"
  # 每类下采样比例（可选）："full:1.0,tooth:0.5,sextant:0.5,group:0.5"
  CATEGORY_SAMPLING: null

MODEL:
  # Choose one of: swin_mae_t, swin_mae_s, swin_mae_b.
  # Use swin_mae if you want to override encoder details in the SWIN section below.
  #
  # 2026-09-20: tiny -> small，与自有方法的 swin small 预设（models/swin_backbone.py
  # SWIN_PRESETS['swins']）对齐。swin_mae_s 走 swin_mae.py::SWIN_MAE_VARIANTS['small']
  #   = embed_dim 96 / depths (2,2,18,2) / num_heads (3,6,12,24) / window 7 / drop_path 0.3
  #   （tiny 是 (2,2,6,2) / drop_path 0.2，drop_path 只在用变体入口时生效）。
  # ⚠️ 必须与 CHECKPOINT_ENCODER 成对切换：tiny 与 small 的 embed_dim / num_heads 完全相同
  #   -> 错配不会报 shape 错，utils/misc.py::load_model 只按 key 名剔除 + strict=False，
  #   tiny ckpt 喂 swin_mae_s 时 stage2 只会填入前 6/18 个 block，其余静默保持随机。
  MODEL: swin_mae_s
  MASK_RATIO: 0.75
  NORM_PIX_LOSS: true
  # 只有 22k 版的 swin_small（官方仓没有 in1k 版）；tiny 用的则是 1k 版，
  # 因此这次切换同时把预训练配方从 ImageNet-1k 换成 ImageNet-22k。
  CHECKPOINT_ENCODER: ".checkpoints/intraoral/swin_small_patch4_window7_224_22k.pth"
  CHECKPOINT_DECODER: ""

OPTIM:
  LR: 1e-4
  MIN_LR: 1e-7
  WARMUP_EPOCHS: 20
  WEIGHT_DECAY: 0.05

LOG:
  OUTPUT_DIR: exp/swinmae_v1
  LOG_DIR: exp/swinmae_v1
  VIS_FREQ: 100
  VIS_NUM_IMAGES: 8

SWANLAB:
  SWANLAB: true
  SWANLAB_PROJECT: dentmap
  SWANLAB_WORKSPACE: zykev
  SWANLAB_RUN_NAME:

DISTRIBUTED:
  WORLD_SIZE: 1
  LOCAL_RANK: -1
  DIST_ON_ITP: false
  DIST_URL: env://
  DIST_BACKEND:

SWIN:
  # The detailed encoder fields below are used only when MODEL.MODEL is swin_mae.
  # For swin_mae_t/swin_mae_s/swin_mae_b, the encoder presets are defined in swin_mae.py
  # from swin.txt: tiny/small/base.
  PRETRAIN_IMG_SIZE: 224
  PATCH_SIZE: 4
  IN_CHANS: 3
  # Leave null to match the decoder input to the selected encoder automatically.
  DECODER_EMBED_DIM:
  EMBED_DIM: 96
  # 镜像 SWIN_MAE_VARIANTS['small']；这些字段只在 MODEL.MODEL == swin_mae 时才被
  # train.py::get_model_kwargs 转发，用 swin_mae_s 时以变体预设为准。
  DEPTHS: [2, 2, 18, 2]
  NUM_HEADS: [3, 6, 12, 24]
  WINDOW_SIZE: 7
  QKV_BIAS: true
  MLP_RATIO: 4.0
  DROP_PATH_RATE: 0.1
  DROP_RATE: 0.0
  ATTN_DROP_RATE: 0.0
  PATCH_NORM: true
  APE: false
